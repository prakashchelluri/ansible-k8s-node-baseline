---
# Packages installed on every node. Names are identical on EL and Ubuntu.
baseline_packages:
  - chrony
  - curl
  - jq
  - logrotate
  - lsof
  - rsync
  - tar
baseline_packages_extra: []

# chrony: "pool" entries resolve to several servers each; "server" entries are single hosts.
baseline_chrony_pools:
  - pool.ntp.org
baseline_chrony_servers: []

# journald drop-in limits (/etc/systemd/journald.conf.d/50-baseline.conf).
baseline_journald_storage: persistent
baseline_journald_system_max_use: 512M
baseline_journald_system_max_file_size: 64M
baseline_journald_max_retention: 2week

# Extra logrotate policies, one file per entry in /etc/logrotate.d/.
# Example: [{ name: myapp, paths: [/var/log/myapp/*.log], frequency: daily, rotate: 7 }]
baseline_logrotate_configs: []

# Written to /etc/sysctl.d/60-baseline.conf and applied immediately.
baseline_sysctl:
  fs.file-max: 2097152
  fs.inotify.max_user_instances: 8192
  fs.inotify.max_user_watches: 524288
  net.core.somaxconn: 4096
  vm.max_map_count: 262144
  vm.swappiness: 10

# Written to /etc/security/limits.d/90-baseline.conf.
baseline_limits:
  - { domain: "*", type: soft, item: nofile, value: 65536 }
  - { domain: "*", type: hard, item: nofile, value: 65536 }
  - { domain: "*", type: soft, item: nproc, value: 65536 }
  - { domain: "*", type: hard, item: nproc, value: 65536 }
