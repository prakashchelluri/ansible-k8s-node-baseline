---
- name: Install dnf-automatic
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

- name: Configure dnf-automatic
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { option: upgrade_type, value: "{{ hardening_basic_dnf_upgrade_type }}" }
    - { option: download_updates, value: "yes" }
    - { option: apply_updates, value: "yes" }

- name: Enable the dnf-automatic timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    enabled: true
    state: started
  # In check mode on a fresh host the package/unit is not really installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
