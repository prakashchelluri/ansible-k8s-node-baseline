---
- name: Check that the OS family is supported
  ansible.builtin.assert:
    that: ansible_facts['os_family'] in ['RedHat', 'Debian']
    fail_msg: "Unsupported OS family {{ ansible_facts['os_family'] }}."
    quiet: true

- name: Load OS family variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install the SSH server
  ansible.builtin.package:
    name: "{{ hardening_basic_ssh_package }}"
    state: present

- name: Create the sshd drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Ubuntu 22.04+ and EL 9 already have this line; EL 8 does not.
- name: Make sshd read drop-in files
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
  # In check mode on a fresh host the package/unit is not really installed yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Configure unattended security updates
  ansible.builtin.include_tasks: "updates-{{ ansible_facts['os_family'] }}.yml"
  when: hardening_basic_auto_updates | bool
