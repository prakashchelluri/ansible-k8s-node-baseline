---
# Example overrides. Every variable here has a default in the role; set only what differs.
ansible_user: ops

baseline_chrony_pools:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
baseline_journald_system_max_use: 1G
baseline_logrotate_configs:
  - name: myapp
    paths:
      - /var/log/myapp/*.log
    frequency: daily
    rotate: 7

node_exporter_listen_address: "0.0.0.0:9100"
node_exporter_extra_args:
  - --collector.systemd

# Keep only key-based SSH. Make sure your key is on the host before applying.
hardening_basic_ssh_permit_root_login: "no"
